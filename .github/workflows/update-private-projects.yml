name: Atualizar progresso dos projetos privados

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

concurrency:
  group: profile-private-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Atualizar painel com permissões mínimas
        env:
          PROFILE_PROJECTS_TOKEN: ${{ secrets.PROFILE_PROJECTS_TOKEN }}
        run: python3 scripts/update_private_projects.py
      - name: Commit somente se houver mudanças
        run: |
          if git status --porcelain -- README.md assets/projects | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md assets/projects
            git commit -m "docs(profile): atualizar indicadores de projetos privados"
            git push
          fi
